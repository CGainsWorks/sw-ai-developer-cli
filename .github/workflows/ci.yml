name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The git integration test drives a real repository. Without an identity
      # `git commit` fails on a fresh runner, and the suite would skip the one
      # test that proves the parser handles real git output.
      - name: Configure git identity
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run coverage

      - name: Build
        run: npm run build

      # Proves the packaged CLI actually runs on this OS, and that every
      # documented exit code is what the demo asserts.
      - name: Run the offline demo
        run: npm run demo

      # The built CLI as a separate process against a mock OpenAI-compatible
      # server (tests/mock-openai/server.mjs): real SDK, real HTTP, no model.
      - name: Exercise the compat provider against the mock server
        run: npm run smoke:compat

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  package:
    name: Install check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # The README's install instructions, step for step: the package is not
      # on npm, so it is built from a clone and installed globally from the
      # packed tarball. `npm pack` runs prepack, so this also catches a build
      # that only works in-tree and a `files` list that omits something.
      - name: Install globally as the README describes
        run: |
          npm ci
          npm pack
          npm install -g --prefix "$RUNNER_TEMP/npm-global" ./sw-ai-developer-cli-*.tgz
          echo "$RUNNER_TEMP/npm-global/bin" >> "$GITHUB_PATH"

      - name: Run the installed CLI from a clean directory
        run: |
          mkdir -p "$RUNNER_TEMP/clean" && cd "$RUNNER_TEMP/clean"
          command -v swai
          swai --version
          swai plugins
          # Templates must ship in the package, or every command fails at runtime.
          swai review --help
          node "$GITHUB_WORKSPACE/scripts/compat_smoke.mjs" swai
